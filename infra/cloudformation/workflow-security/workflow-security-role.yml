---
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Role for the workflow-security PR agent: invokes Claude on Bedrock and nothing
  else. The agent reviews code only and has no AWS CLI access.

# This is the agent's only AWS identity, used to invoke Claude on Bedrock.
# The agent makes no AWS CLI calls, so one account with Bedrock (and access
# to the Anthropic model) is enough. It can never read secret values or data
# contents.

Parameters:

  GitHubOrganization:
    Type: String
    Description: GitHub organization or user that owns the repositories (case sensitive).
    AllowedPattern: "^[A-Za-z0-9-]+$"

  GitHubOrganizationId:
    Type: String
    Description: Numeric org ID for the immutable-ID sub claim (gh api /orgs/<org> --jq .id). * matches any.
    Default: "*"

  RepositoryName:
    Type: String
    Description: Repository allowed to assume the role. * for every repository in the organization.
    Default: "*"

  RepositoryId:
    Type: String
    Description: Numeric repository ID for the immutable-ID sub claim (gh api /repos/<org>/<repo> --jq .id). * matches any.
    Default: "*"

  TrustMode:
    Type: String
    Description: >-
      pull_request = jobs triggered by pull_request events with no
      `environment:`. environment = only jobs running in GitHubEnvironmentName
      (role ARN stored as an environment secret, gated by environment
      protection rules). both = either.
    Default: pull_request
    AllowedValues: [pull_request, environment, both]

  GitHubEnvironmentName:
    Type: String
    Description: GitHub environment trusted when TrustMode is environment or both.
    Default: pr-agents

  WorkflowFile:
    Type: String
    Description: >-
      Workflow file name allowed to assume the role (job_workflow_ref claim),
      e.g. pr-agents.yml. * allows any workflow in the trusted repositories.
    Default: "*"

  WorkflowRepository:
    Type: String
    Description: >-
      Repository that holds WorkflowFile, when the agents run as a required
      workflow from a central repository (an organization ruleset). Empty =
      the trusted repository itself. Set this so a pull request can't edit
      the workflow that assumes the role.
    Default: ""

  WorkflowRef:
    Type: String
    Description: >-
      Git ref WorkflowFile must come from (job_workflow_ref claim), e.g.
      refs/heads/main. * allows any ref, which includes a pull request's own
      edited copy of the workflow.
    Default: "*"

  OidcProviderArn:
    Type: String
    Description: GitHub OIDC provider ARN. Empty = this account's token.actions.githubusercontent.com provider.
    Default: ""

  RoleName:
    Type: String
    Default: github-pr-agent-workflow-security
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 43200

  BedrockModelIdPattern:
    Type: String
    Description: >-
      Anthropic model ID pattern this role may invoke. Applies to foundation
      models and the matching cross-region inference profiles (us.*, eu.*,
      apac.*, global.*).
    Default: anthropic.claude-*

Conditions:
  UseCentralWorkflow: !Not [!Equals ["", !Ref WorkflowRepository]]
  UseDefaultProviderArn: !Equals ["", !Ref OidcProviderArn]
  TrustBoth: !Equals [both, !Ref TrustMode]
  TrustPullRequestOnly: !Equals [pull_request, !Ref TrustMode]

Resources:

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Invoke Claude on Bedrock for the workflow-security PR agent. No other AWS access.
      MaxSessionDuration: !Ref MaxSessionDuration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsOidc
            Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - UseDefaultProviderArn
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                - !Ref OidcProviderArn
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:job_workflow_ref: !If
                  - UseCentralWorkflow
                  - !Sub ${GitHubOrganization}/${WorkflowRepository}/.github/workflows/${WorkflowFile}@${WorkflowRef}
                  - !Sub ${GitHubOrganization}/${RepositoryName}/.github/workflows/${WorkflowFile}@${WorkflowRef}
                token.actions.githubusercontent.com:sub: !If
                  - TrustBoth
                  - - !Sub repo:${GitHubOrganization}/${RepositoryName}:pull_request
                    - !Sub repo:${GitHubOrganization}@${GitHubOrganizationId}/${RepositoryName}@${RepositoryId}:pull_request
                    - !Sub repo:${GitHubOrganization}/${RepositoryName}:environment:${GitHubEnvironmentName}
                    - !Sub repo:${GitHubOrganization}@${GitHubOrganizationId}/${RepositoryName}@${RepositoryId}:environment:${GitHubEnvironmentName}
                  - !If
                    - TrustPullRequestOnly
                    - - !Sub repo:${GitHubOrganization}/${RepositoryName}:pull_request
                      - !Sub repo:${GitHubOrganization}@${GitHubOrganizationId}/${RepositoryName}@${RepositoryId}:pull_request
                    - - !Sub repo:${GitHubOrganization}/${RepositoryName}:environment:${GitHubEnvironmentName}
                      - !Sub repo:${GitHubOrganization}@${GitHubOrganizationId}/${RepositoryName}@${RepositoryId}:environment:${GitHubEnvironmentName}
      Policies:
        - PolicyName: bedrock-invoke-anthropic
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeAnthropicModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockModelIdPattern}
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*.${BedrockModelIdPattern}
              - Sid: ResolveInferenceProfiles
                Effect: Allow
                Action:
                  - bedrock:GetInferenceProfile
                Resource: !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*.${BedrockModelIdPattern}
        - PolicyName: deny-data-reads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Guardrail: even if a broader policy is attached later, this
              # role can never read secret values or data contents.
              - Sid: DenySecretAndDataReads
                Effect: Deny
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:BatchGetSecretValue
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                  - ssm:GetParameterHistory
                  - ec2:GetPasswordData
                  - ec2:DescribeInstanceAttribute
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - s3:GetObject*
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - sqs:ReceiveMessage
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                Resource: "*"
              - Sid: DenyCustomerParameterValues
                Effect: Deny
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                NotResource:
                  # AWS-published public parameters (e.g. latest AMI IDs) stay readable.
                  - !Sub arn:${AWS::Partition}:ssm:*::parameter/aws/service/*
      Tags:
        - Key: pr-agent-role
          Value: workflow-security

Outputs:
  RoleArn:
    Description: Agent role (Bedrock only). Store as the AWS_PR_AGENT_WORKFLOW_ROLE_ARN secret (repository or environment).
    Value: !GetAtt AgentRole.Arn
